<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <!-- Ícono SCI: dos cuadrados rotados entrelazados (chain link) -->
  <g transform="translate(4, 4)">
    <!-- Cuadrado 1 rotado 45° -->
    <rect x="6" y="6" width="28" height="28" rx="4"
          transform="rotate(45 20 20)"
          stroke="#00d8da" stroke-width="3" fill="none"/>
    <!-- Cuadrado 2 desplazado -->
    <rect x="20" y="6" width="28" height="28" rx="4"
          transform="rotate(45 34 20)"
          stroke="#7572e9" stroke-width="3" fill="none"/>
  </g>
  <!-- Texto Supply Chain Institute -->
  <text x="62" y="22"
        font-family="'Outfit', Arial, sans-serif"
        font-size="13"
        font-weight="700"
        fill="white"
        letter-spacing="0.5">supply chain</text>
  <text x="62" y="38"
        font-family="'Outfit', Arial, sans-serif"
        font-size="11"
        font-weight="400"
        fill="rgba(255,255,255,0.6)"
        letter-spacing="2">institute</text>
</svg>
